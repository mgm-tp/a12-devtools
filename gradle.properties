org.gradle.configuration-cache=true

# CI agents are 4 GB / 4 CPU. Without explicit caps every forked JVM sizes its
# heap at 25% of the container and the sum OOM-kills the pod. Kotlin compiles
# in-process because a separate Kotlin daemon costs ~750M resident on its own.
org.gradle.jvmargs=-Xmx768m -XX:MaxMetaspaceSize=384m
kotlin.compiler.execution.strategy=in-process
org.gradle.workers.max=2
org.gradle.parallel=false

a12ReleaseLine=2026.06
