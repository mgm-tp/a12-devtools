# Run `gradle versionCatalogUpdate --interactive` to update this file
[versions]
# Gradle plugins (third-party)
cyclonedx = "3.2.4"
spotless = "8.7.0"
version-catalog-update = "1.1.0"
kotlin = "2.3.0"
# Third-party libraries
spock-core = "2.4-groovy-4.0"
groovy-all = "4.0.29"
jackson = "3.1.3"
poi = "5.5.1"
junit = "6.0.1"
kotest = "5.9.1"

[libraries]
spock-core = { module = "org.spockframework:spock-core", version.ref = "spock-core" }
groovy-all = { module = "org.apache.groovy:groovy-all", version.ref = "groovy-all" }
groovy-yaml = { module = "org.apache.groovy:groovy-yaml", version.ref = "groovy-all" }
jackson-databind = { module = "tools.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-dataformat-yaml = { module = "tools.jackson.dataformat:jackson-dataformat-yaml", version.ref = "jackson" }
poi-ooxml = { module = "org.apache.poi:poi-ooxml", version.ref = "poi" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
kotest-assertions-core = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }

[plugins]
cyclonedx = { id = "org.cyclonedx.bom", version.ref = "cyclonedx" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
version-catalog-update = { id = "nl.littlerobots.version-catalog-update", version.ref = "version-catalog-update" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
