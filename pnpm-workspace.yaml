packages:
  - packages/*

# do not allow any postinstall scripts
allowBuilds:
  esbuild: false

auditConfig:
  ignoreGhsas:
    # DoS via unbounded expansion in brace-expansion. Fixed in 5.0.8 (see the
    # override below), but the 1.x line has no patch and is still pulled in via
    # minimatch@3 <- eslint. Accepted: dev-time lint tooling, not shipped code.
    - GHSA-mh99-v99m-4gvg

catalog:
  "@eslint/js": ^9.39.4
  "@inquirer/prompts": ^8.4.2
  "@microsoft/api-extractor": ^7.58.7
  "@testing-library/dom": ^10.4.1
  "@testing-library/react": ^16.3.2
  "@types/node": ^24.12.2
  "@types/picomatch": ^4.0.3
  "@types/react": ^19.2.14
  "@types/react-dom": ^19.2.3
  "@types/semver": ^7.7.1
  "@types/yargs": ^17.0.35
  "@vitest/coverage-v8": ^4.1.5
  "@welldone-software/why-did-you-render": ^10.0.1
  asciidoctor: ^4.0.5
  chalk: ^5.6.2
  commander: ^14.0.3
  conventional-changelog: ^8.1.0
  conventional-changelog-conventionalcommits: ^10.2.1
  eslint: ^9.39.4
  eslint-plugin-import: ^2.32.0
  eslint-plugin-notice: 1.1.0-rc1
  eslint-plugin-react: ^7.37.5
  eslint-plugin-react-hooks: ^7.1.1
  execa: ^9.6.1
  fast-deep-equal: ^3.1.3
  glob: ^13.0.6
  globals: ^17.6.0
  picomatch: ^4.0.4
  prettier: ^3.8.3
  react: ^19.2.5
  semver: ^7.7.4
  strip-ansi: ^7.2.0
  ts-morph: ^27.0.2
  tsx: ^4.21.0
  typescript: ^6.0.3
  typescript-eslint: ^8.59.2
  vitest: ^4.1.5
  yargs: ^18.0.0

catalogs:
  peers:
    "@testing-library/dom": ^10.4.1
    "@testing-library/react": ^16.3.0
    "@welldone-software/why-did-you-render": ^10.0.1
    eslint: ^9.14.0
    react: ^19.0.0

    # users of devtools can choose *any* TS version greater than this IF they verify it with the compat command
    typescript: ">=6.0.2"

# cleanup catalog entries during install
cleanupUnusedCatalogs: true

# no cycles between workspace dependencies
disallowWorkspaceCycles: true
# enforce version constraints from package.json
engineStrict: true

# when using "--filter", check that the filter applies to some package
failIfNoMatch: true

# do not check git status when publishing
gitChecks: false

# jenkins sets this to warn by default
loglevel: info

# enforce new packages to be at least 1 week old, except our own
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - "@com.mgmtp.a12.*/*"
  # asciidoctor 4.0.x (+ its exact-pinned @asciidoctor/core) are <7d old when first pulled
  - "asciidoctor"
  - "@asciidoctor/core"
  # advisory patches released <7d ago, see the overrides below
  - js-yaml@5.2.2
  - brace-expansion@1.1.18 || 5.0.8 || 5.0.9
  - esbuild@0.28.1
  - vite@8.0.16
  - fast-uri@3.1.3 || 3.1.4 || 3.1.5
  - postcss@8.5.18 || 8.5.23

overrides:
  # temporary for security fix
  "ajv@>=7.0.0-alpha.0": ">=8.18.0"
  # GHSA-pm4m-ph32-ghv5 (DoS in flow collections) affects <=5.2.1
  js-yaml: ">=5.2.2"
  # GHSA-mh99-v99m-4gvg (DoS via unbounded expansion) affects <=5.0.7
  "brace-expansion@>=5.0.0": ">=5.0.8"
  "libxmljs2": "-"
  "lodash@>=4.0.0": ">=4.18.0"
  "@babel/core": ">=7.29.1"
  esbuild@>=0.27.3 <0.28.1: ^0.28.1
  postcss@<=8.5.17: ^8.5.18
  vite@>=8.0.0 <=8.0.15: ^8.0.16
  fast-uri@>=3.0.0 <3.1.5: ^3.1.5
  postcss@<=8.5.22: ^8.5.23

# prevent pnpm >10 from self-upgrading
pmOnFail: ignore

# (for now), only trusted authors can change the lockfile
trustLockfile: true

# do not install packages where trust level decreased
trustPolicy: no-downgrade

# before "pnpm run" calls, checks if node_modules are up-to-date
# (e.g. after rebasing / checking out a branch and forgetting "pnpm install")
verifyDepsBeforeRun: warn
